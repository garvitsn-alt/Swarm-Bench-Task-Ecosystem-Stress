sub_tasks:

  - id: water_specialist
    description: |
      Analyze only these input reports:
      - Hassan2812024JGEESI111906.pdf
      - ace3.pdf
      - Clean.pdf
      - 1746179179-causes-effects-and-solutions.pdf
      - Pollution.pdf
      - te_1094_prn.pdf
      - Management BFSc-608.pdf

      Extract for each report:
      - document_id
      - contaminant_count
      - human_health_flag
      - aquatic_ecosystem_flag
      - industrial_source_flag
      - remediation_flag
      - severity_class

      Rules:
      - flags ∈ {0,1}
      - severity_class ∈ {1,2,3,4,5}

      contaminant_count:
      - 0 = no contaminant groups discussed
      - 1 = 1-2 contaminant groups discussed
      - 2 = 3-4 contaminant groups discussed
      - 3 = 5 or more contaminant groups discussed

      Return structured JSON only.
      Do not calculate scores.

    depends_on: []
    parallel_group: fan_out

  - id: soil_land_specialist
    description: |
      Analyze only these input reports:
      - BALLAYAN 2000.pdf
      - pollution__FAO.pdf
      - report-2001.pdf
      - sustainability-07-03528.pdf
      - 1851_9781351115629_previewpdf.pdf
      - 8398.pdf

      Extract for each report:
      - document_id
      - erosion_flag
      - salinity_flag
      - fertility_loss_flag
      - desertification_flag
      - pollution_flag
      - restoration_flag
      - affected_scale

      Rules:
      - flags ∈ {0,1}
      - affected_scale ∈ {1,2,3,4}

      affected_scale:
      - 1 = local
      - 2 = regional
      - 3 = national
      - 4 = global

      pollution_flag:
      - Use 1 only for direct soil contamination or soil pollutants.
      

      desertification_flag:
      - Use 1 only if desertification, dryland degradation, or arid land degradation is directly discussed.
      

      Return structured JSON only.
      Do not calculate scores.

    depends_on: []
    parallel_group: fan_out


  - id: forest_biodiversity_specialist
    description: |
      Analyze only these input reports:
      - L-0025804346-pdf.pdf
      - book.pdf
      - egm-report.pdf
      - isfr_book_eng-vol-1_2023.pdf
      - main work.pdf

      Extract for each report:
      - document_id
      - forest_loss_flag
      - habitat_loss_flag
      - biodiversity_decline_flag
      - fire_risk_flag
      - conservation_gap_flag
      - monitoring_only_flag
      - impact_scale

      Rules:
      - flags ∈ {0,1}
      - impact_scale ∈ {1,2,3,4}

      impact_scale:
      - 1 = local
      - 2 = regional
      - 3 = national
      - 4 = global

      fire_risk_flag:
      - Use 1 only if forest fire, wildfire, fire-risk, or fire-prone forest evidence is directly discussed.
      

      monitoring_only_flag:
      - Use 1 if the report mainly presents assessment, inventory, mapping, or monitoring results.
      

      Return structured JSON only.
      Do not calculate scores.

    depends_on: []
    parallel_group: fan_out


  - id: mixed_pollution_specialist
    description: |
      Analyze only these input reports:
      - (10)B-3643-Final.pdf
      - AUJES_Volume 2_Issue 4_Pages 218-239.pdf
      - epdf.pub.pdf
      - Handbook.pdf
      - attachment_69951686907167.pdf
      - 646717.pdf

      Extract for each report:
      - document_id
      - air_pollution_flag
      - mining_impact_flag
      - industrial_pollution_flag
      - multi_system_damage_flag
      - ecological_damage_flag
      - conceptual_flag
      - severity_class

      Rules:
      - flags ∈ {0,1}
      - severity_class ∈ {1,2,3,4,5}

      industrial_pollution_flag:
      - Use 1 only if industrial contamination, industrial emissions, industrial waste, or discharge is directly discussed.
      

      multi_system_damage_flag:
      - Use 1 only if two or more environmental systems are clearly affected.
            ecological_damage_flag:
      - Use 1 only if direct ecological or environmental harm is discussed.
     
   
      Return structured JSON only.
      Do not calculate scores.

    depends_on: []
    parallel_group: fan_out


  - id: page_retrieval_specialist
    description: |
      Analyze only these input reports:
      - attachment_69951686907167.pdf
      - 646717.pdf
      - isfr_book_eng-vol-1_2023.pdf

      Extract printed TOC page numbers only.

      Extract:
      - mine_water_rebound_page
      - dying_of_happiness_page
      - upload_prefire_alert_page
      - acid_mine_drainage_page
      - falling_out_with_hal_page
      - fire_prone_areas_page
      - prediction_control_acid_page
      - afterword_page
      - comparison_prefire_page

      Use printed book/report page numbers from the table of contents.
      Do not use PDF viewer page number.
      Do not use physical page count.
      Do not use page index.

      Return structured JSON only.
      Do not calculate values.

    depends_on: []
    parallel_group: fan_out


  - id: reducer
    description: |
      Use only intermediate JSON outputs.

      Do all score calculations here.

      Water score:

      For each water report:

      water_raw_score =
      contaminant_count * 6
      + human_health_flag * 15
      + aquatic_ecosystem_flag * 12
      + industrial_source_flag * 10
      + severity_class * 8
      - remediation_flag * 5

      if contaminant_count > 4:
        water_raw_score = water_raw_score + 7

      if human_health_flag = 1 and aquatic_ecosystem_flag = 1:
        water_raw_score = water_raw_score + 8

      if remediation_flag = 1 and severity_class < 3:
        water_raw_score = water_raw_score - 6

      water_domain_score =
      average(all water_raw_score)

      if water_domain_score > 82:
        water_domain_score = water_domain_score + 5


      Soil score:

      For each soil report:

      soil_raw_score =
      erosion_flag * 12
      + salinity_flag * 10
      + fertility_loss_flag * 14
      + desertification_flag * 18
      + pollution_flag * 13
      + affected_scale * 10
      - restoration_flag * 6

      if desertification_flag = 1 and affected_scale > 2:
        soil_raw_score = soil_raw_score * 1.15

      if erosion_flag = 1 and fertility_loss_flag = 1:
        soil_raw_score = soil_raw_score + 7

      if restoration_flag = 1 and pollution_flag = 0:
        soil_raw_score = soil_raw_score - 5

      soil_domain_score =
      average(all soil_raw_score)

      if soil_domain_score > 80:
        soil_domain_score = soil_domain_score + 4


      Forest score:

      For each forest report:

      forest_raw_score =
      forest_loss_flag * 16
      + habitat_loss_flag * 14
      + biodiversity_decline_flag * 16
      + fire_risk_flag * 10
      + conservation_gap_flag * 8
      + impact_scale * 10
      - monitoring_only_flag * 10

      if forest_loss_flag = 1 and biodiversity_decline_flag = 1:
        forest_raw_score = forest_raw_score + 10

      if fire_risk_flag = 1 and impact_scale > 2:
        forest_raw_score = forest_raw_score + 6

      if monitoring_only_flag = 1 and forest_raw_score > 45:
        forest_raw_score = 45

      forest_domain_score =
      average(all forest_raw_score)

      if forest_domain_score > 78:
        forest_domain_score = forest_domain_score + 6


      Mixed pollution score:

      For each mixed report:

      mixed_raw_score =
      air_pollution_flag * 10
      + mining_impact_flag * 14
      + industrial_pollution_flag * 12
      + multi_system_damage_flag * 16
      + ecological_damage_flag * 16
      + severity_class * 8
      - conceptual_flag * 20

      if air_pollution_flag = 1 and industrial_pollution_flag = 1:
        mixed_raw_score = mixed_raw_score + 8

      if mining_impact_flag = 1 and ecological_damage_flag = 1:
        mixed_raw_score = mixed_raw_score + 9

      if conceptual_flag = 1 and ecological_damage_flag = 0:
        mixed_raw_score = mixed_raw_score / 2

      mixed_domain_score =
      average(all mixed_raw_score)

      if mixed_domain_score > 75:
        mixed_domain_score = mixed_domain_score + 5


      Page retrieval calculations:

      value_1 =
      (dying_of_happiness_page + upload_prefire_alert_page)
      - mine_water_rebound_page

      value_2 =
      (acid_mine_drainage_page + fire_prone_areas_page)
      - falling_out_with_hal_page

      value_3 =
      (prediction_control_acid_page + afterword_page)
      - comparison_prefire_page

      retrieval_score =
      round(
        (
          abs(value_1)
          + floor(value_2 / 10)
          + floor(value_3 / 10)
        ) / 5
      )


      Final synthesis:

      domain_pressure_score =
      round(
        water_domain_score * 0.30
        + soil_domain_score * 0.25
        + forest_domain_score * 0.25
        + mixed_domain_score * 0.20
      )

      cross_domain_penalty = 0

      if water_domain_score > 82 and soil_domain_score > 78:
        cross_domain_penalty = cross_domain_penalty + 10

      if forest_domain_score > 80 and mixed_domain_score > 74:
        cross_domain_penalty = cross_domain_penalty + 8

      if water_domain_score > 85 and forest_domain_score > 75:
        cross_domain_penalty = cross_domain_penalty + 6

      if retrieval_score > 40:
        cross_domain_penalty = cross_domain_penalty + 5

      final_synthesis_value =
      domain_pressure_score
      + cross_domain_penalty
      - retrieval_score

      Final output must contain only:
      -  source_files_used
      - water_domain_score
      - soil_domain_score
      - forest_domain_score
      - mixed_domain_score
      - retrieval_score
      - final_synthesis_value

      Return final JSON only.
 

    depends_on:
      - water_specialist
      - soil_land_specialist
      - forest_biodiversity_specialist
      - mixed_pollution_specialist
      - page_retrieval_specialist